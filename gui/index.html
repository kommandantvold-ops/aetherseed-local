<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Companion</title>
<style>
:root{
  --ground:#0C1110; --surface:#131A18; --surface-2:#1B2421; --line:#25322D;
  --ink:#E6EDE9; --ink-2:#A3B5AC; --ink-3:#71847B;
  --accent:#4FA582; --accent-soft:#16302680;
  --brass:#C89B5A; --brass-soft:#2E2413;
  --alarm:#C97A6C; --alarm-soft:#2F1D1A;
  --radius:10px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#EDF1EE; --surface:#F7FAF8; --surface-2:#E4EAE6; --line:#D2DBD6;
    --ink:#101815; --ink-2:#45544D; --ink-3:#6E7F77;
    --accent:#1F6F55; --accent-soft:#DCE9E3;
    --brass:#8A6427; --brass-soft:#F2E8D6;
    --alarm:#A44A3F; --alarm-soft:#F5E1DD;
  }
}
*{box-sizing:border-box}
/* [hidden] must win over a class that sets display (.search, .card .row). */
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font:16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"DejaVu Sans",sans-serif;
  display:flex; flex-direction:column;
}
header{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--line);
}
.mark{font-weight:600; letter-spacing:.01em; font-size:17px}
.mark #markSub{color:var(--ink-3); font-weight:400; margin-left:8px; font-size:13px}
.chips{display:flex; gap:7px; flex-wrap:wrap; margin-left:auto; align-items:center}
.chip{
  font-size:12px; color:var(--ink-2); background:var(--surface-2);
  border:1px solid var(--line); border-radius:999px; padding:3px 10px; white-space:nowrap;
}
.chip b{color:var(--ink); font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block;margin-right:6px;vertical-align:-1px}
.dot.up{background:var(--accent)} .dot.down{background:var(--alarm)}
button{
  font:inherit; font-size:13px; color:var(--ink-2); background:var(--surface-2);
  border:1px solid var(--line); border-radius:8px; padding:5px 12px; cursor:pointer;
}
button:hover{color:var(--ink); border-color:var(--ink-3)}
button:disabled{opacity:.45; cursor:default}

main{flex:1; overflow-y:auto; padding:22px 16px 8px}
.wrap{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:18px}

.turn{display:flex; flex-direction:column; gap:6px}
.who{font-size:12px; color:var(--ink-3); letter-spacing:.04em; text-transform:uppercase}
.bubble{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:12px 14px; white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.turn.you .bubble{background:var(--surface-2); border-color:transparent}
.turn.node .bubble{border-left:2px solid var(--accent)}
.turn.fiction .bubble{border-left-color:var(--brass)}
.turn.flagged .bubble{border-left-color:var(--alarm)}

.prov{display:flex; gap:7px; flex-wrap:wrap; font-size:12px; align-items:center}
.tag{border-radius:999px; padding:2px 9px; border:1px solid transparent}
.tag.fiction{background:var(--brass-soft); color:var(--brass); border-color:var(--brass)}
.tag.flagged{background:var(--alarm-soft); color:var(--alarm); border-color:var(--alarm)}
.tag.quiet{color:var(--ink-3)}
.why{color:var(--ink-3)}

.note{color:var(--ink-3); font-size:13px; text-align:center; padding:6px 0}
.record{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; white-space:pre-wrap; font-size:14px; color:var(--ink-2);
}
.record h3{margin:0 0 8px; font-size:13px; color:var(--ink); letter-spacing:.04em; text-transform:uppercase}

footer{
  background:var(--surface); border-top:1px solid var(--line); padding:12px 16px;
}
.composer{max-width:760px; margin:0 auto; display:flex; gap:10px; align-items:flex-end}
textarea{
  flex:1; resize:none; font:inherit; color:var(--ink); background:var(--ground);
  border:1px solid var(--line); border-radius:var(--radius); padding:11px 12px;
  min-height:46px; max-height:160px;
}
textarea:focus{outline:none; border-color:var(--accent)}
.send{background:var(--accent); color:#06120D; border-color:transparent; font-weight:600; padding:11px 18px}
.send:hover{color:#06120D}
.hint{max-width:760px; margin:8px auto 0; font-size:12px; color:var(--ink-3); display:flex; gap:14px; flex-wrap:wrap}
.cursor::after{content:"▍"; color:var(--accent); animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (max-width:560px){ .chips{width:100%; margin-left:0} }

/* First run: the steward names the companion and picks its language. */
.setup{position:fixed; inset:0; background:var(--ground); display:flex;
  align-items:center; justify-content:center; padding:24px; z-index:10}
.setup[hidden]{display:none}
.card{width:100%; max-width:520px; background:var(--surface); border:1px solid var(--line);
  border-radius:14px; padding:28px 26px}
.card h1{font-size:20px; font-weight:600; margin:0 0 6px}
.card .help{color:var(--ink-3); font-size:13px; margin:0 0 16px}
.langs{display:flex; flex-direction:column; gap:10px; margin-top:16px}
.lang{display:block; text-align:left; width:100%; padding:14px 16px; font-size:16px;
  color:var(--ink); background:var(--surface-2)}
.lang small{display:block; color:var(--ink-3); font-size:12px; margin-top:4px}
.card input{width:100%; font:inherit; font-size:18px; color:var(--ink); background:var(--ground);
  border:1px solid var(--line); border-radius:var(--radius); padding:11px 12px}
.card input:focus{outline:none; border-color:var(--accent)}
.card .err{color:var(--alarm); font-size:13px; margin:8px 0 0}
.card .row{display:flex; justify-content:space-between; margin-top:18px; gap:10px}
.card .row .send{margin-left:auto}

/* The ring tree (step 37): every ring, what it chose, the model's own sentence
   about it - labelled - and the turns it took. Read-only. */
button.chip{cursor:pointer}
button.chip:hover{color:var(--ink); border-color:var(--ink-3)}
.card.wide{max-width:760px; max-height:calc(100vh - 48px); overflow-y:auto}
.card .top{display:flex; align-items:center; gap:10px; margin:0 0 6px}
.card .top h1{margin:0}
.card .top button{margin-left:auto}
.tree{border-left:2px solid var(--line); margin:14px 0 0 6px; padding-left:14px;
  display:flex; flex-direction:column; gap:10px}
.ring summary{cursor:pointer; font-size:14px; color:var(--ink); list-style-position:outside}
.ring .chosen{font-size:14px; color:var(--ink-2); margin:6px 0 0}
.ring .own{font-size:14px; color:var(--brass); margin:4px 0 0}
.ring .own.quiet{color:var(--ink-3)}
.ring ol{margin:8px 0 0; padding-left:4px; list-style:none; font-size:13px; color:var(--ink-3)}
.ring li{margin:2px 0; overflow-wrap:anywhere}
.tree .growing{font-size:13px; color:var(--ink-3)}

/* Guided correction (build log 50): the steward supports or corrects a turn or
   a ring. Everything the model or a person said is set as text, never markup. */
.tabs{display:flex; gap:8px; margin:10px 0 4px}
.tabs button[aria-pressed="true"]{color:var(--ink); border-color:var(--accent); background:var(--accent-soft)}
.search{display:flex; gap:8px; margin:10px 0 0}
.search input{flex:1; font-size:15px}
.mem{border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; background:var(--surface-2)}
.mem .head{font-size:12px; color:var(--ink-3); letter-spacing:.02em}
.mem .said{font-size:14px; margin:6px 0 0; white-space:pre-wrap; overflow-wrap:anywhere}
.mem .said b{font-weight:600; color:var(--ink-2)}
.state{font-size:13px; margin:8px 0 0}
.state.ok{color:var(--accent)} .state.fix{color:var(--brass)} .state.aside{color:var(--ink-3)}
.acts{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 0}
.guide{border-top:1px solid var(--line); margin:10px 0 0; padding:10px 0 0; display:flex; flex-direction:column; gap:8px}
.guide h2{font-size:14px; margin:0; font-weight:600}
.guide .choices{display:flex; flex-direction:column; gap:6px}
.guide .choices button{text-align:left; font-size:14px; color:var(--ink)}
.guide textarea{width:100%; min-height:70px; font-size:15px}
.guide .count{font-size:12px; color:var(--ink-3); text-align:right}
.guide ul{margin:0; padding-left:18px; font-size:14px; color:var(--ink-2)}
.guide .err{color:var(--alarm); font-size:13px}
.ring .acts{margin-top:10px}

/* The steward's own documents (build log 62). A title is the name of a file
   someone chose: set as text, never markup, like everything else here. */
.doc{border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; background:var(--surface-2)}
.doc .name{font-size:15px; color:var(--ink); overflow-wrap:anywhere}
.doc .acts{margin-top:8px}
.card .row.left{justify-content:flex-start}
.card .row.left .send{margin-left:0}
.card .help.how{margin:14px 0 0}
.card .help.second{margin:14px 0 6px}

/* The training loop (build log 64): played, paused and watched from here. */
.bar{height:8px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; margin:10px 0 0}
.bar i{display:block; height:100%; width:0; background:var(--accent)}
.train .now{font-size:15px; color:var(--ink); margin:12px 0 0}
.train h2{font-size:14px; font-weight:600; margin:18px 0 6px}
.levels{display:grid; grid-template-columns:repeat(auto-fit, minmax(118px, 1fr)); gap:6px; margin:8px 0 0}
.levels .lv{border:1px solid var(--line); border-radius:var(--radius); padding:6px 8px; font-size:12px; color:var(--ink-3); background:var(--surface-2)}
.levels .lv b{display:block; font-size:15px; color:var(--ink); font-weight:600}
.levels .lv.pass{border-color:var(--accent)} .levels .lv.fail{border-color:var(--brass)}
.levels .lv.cur{background:var(--accent-soft)}
.round{border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; margin:8px 0 0; background:var(--surface-2)}
.round .head{font-size:13px; color:var(--ink-2)}
.round .said{font-size:14px; color:var(--ink); margin:8px 0 0}
.who{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 4px}
.who input{flex:1 1 160px; min-width:0; font-size:15px}
.who span{font-size:13px; color:var(--ink-2)}
</style>
</head>
<body>
<header>
  <div class="mark"><span id="markName"></span><span id="markSub"></span></div>
  <div class="chips">
    <span class="chip"><span class="dot" id="health"></span><span id="healthText"></span></span>
    <span class="chip"><span id="trustLabel"></span> <b id="trust">–</b></span>
    <button type="button" class="chip" id="memoryChip"><span id="memoryLabel"></span> <b id="episodes">–</b></button>
    <button type="button" class="chip" id="rings">–</button>
    <span class="chip" id="modelChip">–</span>
    <button id="shelfBtn"></button>
    <button id="trainBtn"></button>
    <button id="recordBtn"></button>
    <button id="offBtn"></button>
  </div>
</header>

<main id="main">
  <div class="wrap" id="transcript">
    <div class="note" id="intro"><span id="intro1"></span><br><span id="intro2"></span></div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" autofocus></textarea>
    <button class="send" id="send"></button>
  </div>
  <div class="hint">
    <span id="hintText"></span>
    <span id="bounds"></span>
  </div>
</footer>

<!-- Shutdown: a page overlay, not a browser dialog - the kiosk has no one to
     answer a modal it did not draw itself. -->
<div class="setup" id="off" hidden>
  <div class="card">
    <h1 id="offTitle"></h1>
    <p class="help" id="offHelp"></p>
    <p class="err" id="offError" hidden></p>
    <div class="row" id="offRow">
      <button type="button" id="offCancel"></button>
      <!-- The page's ordinary button, not the alarm colour: quantum rest is
           an orderly power-off, and a red button reads as a killswitch. -->
      <button type="button" class="send" id="offGo"></button>
    </div>
  </div>
</div>

<div class="setup" id="tree" hidden>
  <div class="card wide">
    <div class="top"><h1 id="treeTitle"></h1><button type="button" id="treeClose"></button></div>
    <div class="tabs" role="group">
      <button type="button" id="tabRings" aria-pressed="true"></button>
      <button type="button" id="tabTurns" aria-pressed="false"></button>
    </div>
    <p class="help" id="treeHelp"></p>
    <form class="search" id="turnSearch" hidden>
      <input id="turnQuery" maxlength="80" autocomplete="off" spellcheck="false">
      <button type="submit" id="turnFind"></button>
    </form>
    <div class="tree" id="treeBody"></div>
    <div class="row" id="turnMoreRow" hidden><button type="button" id="turnMore"></button></div>
  </div>
</div>

<!-- The steward's own documents (build log 62): added from a phone or a
     laptop on the unit's Wi-Fi. On the unit's own screen the browser is
     locked and opens no file dialog, so there the list is shown and the way
     to add is told. -->
<div class="setup" id="shelf" hidden>
  <div class="card wide">
    <div class="top"><h1 id="shelfTitle"></h1><button type="button" id="shelfClose"></button></div>
    <p class="help" id="shelfHelp"></p>
    <div class="row left" id="shelfAddRow">
      <input type="file" id="shelfFile" accept=".pdf,.txt,.md,application/pdf,text/plain,text/markdown" hidden>
      <button type="button" class="send" id="shelfAdd"></button>
    </div>
    <p class="state" id="shelfProgress" hidden></p>
    <p class="err" id="shelfError" hidden></p>
    <div class="tree" id="shelfBody"></div>
    <p class="help how" id="shelfHow"></p>
  </div>
</div>

<!-- The training loop (build log 64): homework at each trust level, played and
     paused from here - the unit's own screen, or a phone on its Wi-Fi. -->
<div class="setup" id="training" hidden>
  <div class="card wide train">
    <div class="top"><h1 id="trainTitle"></h1><button type="button" id="trainClose"></button></div>
    <p class="help" id="trainHelp"></p>
    <form class="who" id="whoForm">
      <span id="whoLabel"></span>
      <input id="whoInput" maxlength="24" autocomplete="off" spellcheck="false">
      <button type="submit" id="whoSave"></button>
    </form>
    <p class="err" id="whoError" hidden></p>
    <p class="state" id="trainState"></p>
    <div class="bar"><i id="trainBar"></i></div>
    <p class="now" id="trainNow" hidden></p>
    <p class="state" id="trainLast" hidden></p>
    <div class="levels" id="trainLevels"></div>
    <p class="err" id="trainError" hidden></p>
    <div class="row left" id="trainActs"></div>
    <p class="state aside" id="trainReal"></p>
    <div id="trainRounds"></div>
    <div id="trainHistory"></div>
  </div>
</div>

<div class="setup" id="setup" hidden>
  <div class="card">
    <div id="stepLang">
      <h1>Choose a language · Velg språk</h1>
      <div class="langs" id="langList"></div>
    </div>
    <form id="stepName" hidden>
      <h1 id="nameTitle"></h1>
      <p class="help" id="nameHelp"></p>
      <input id="nameInput" maxlength="24" autocomplete="off" spellcheck="false">
      <p class="help second" id="stewardHelp"></p>
      <input id="stewardInput" maxlength="24" autocomplete="off" spellcheck="false">
      <p class="err" id="nameError" hidden></p>
      <div class="row">
        <button type="button" id="backBtn"></button>
        <button type="submit" class="send" id="nameGo"></button>
      </div>
    </form>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const transcript = $('transcript'), main = $('main'), input = $('input'), send = $('send');
let busy = false;

// Everything the console says, in each language the device offers. Model
// output is never put through here - only the console's own words.
const T = {
  en: {
    sub: 'local companion', checking: 'checking', up: 'on device', down: 'unreachable',
    trust: 'trust', memory: 'memory', record: 'What have you gotten wrong?',
    intro1: 'Everything here runs on this device. Nothing is sent anywhere.',
    intro2: 'Answers are bounded and their provenance is shown — everything is remembered, and what is fiction, unverified or corrected carries a tag saying so.',
    placeholder: (n) => `Talk to ${n}…`, send: 'Send',
    hint: 'Enter to send · Shift+Enter for a new line',
    you: 'you', recordWho: 'the record — read from the log, not written by the model',
    fiction: 'Fiction, at your request',
    unverified: 'Unverified source — remembered with that tag',
    unchecked: 'Not checked for invented sources — remembered with that tag',
    stewardUnbacked: 'Credits its steward with something it was not shown — remembered as unverified',
    usedMemory: 'used memory', usedTools: 'used tools',
    usedTagged: (n) => n === 1 ? 'was shown 1 tagged memory' : `was shown ${n} tagged memories`,
    remembered: (r, a) => a ? `${r} remembered · ${a} of them tagged` : `${r} remembered`,
    told: (n) => `${n} from its steward`,
    usedFacts: 'used what its steward told it', usedRing: 'used a ring',
    rings: (n) => n === 0 ? 'no rings yet' : n === 1 ? '1 ring' : `${n} rings`,
    treeTitle: 'Rings', close: 'Close',
    treeHelp: 'A ring is 20 turns of factual conversation, closed together. The first part of each was chosen from the words said to it — nothing there is invented. The sentence after it was written by the model, and says so.',
    chosen: 'Chosen from what was said:',
    ownWords: (n) => n ? `In ${n}’s own words, unchecked:` : 'In its own words, unchecked:',
    ownPending: 'No sentence of its own yet.',
    ownWithheld: (why) => `No sentence of its own (${why}).`,
    ringHead: (no, n, when) => `Ring ${no} · ${n} turns · closed ${when}`,
    growing: (i, o) => `Growing: ${i} of ${o} toward the next ring`,
    noRings: 'No rings yet.', noTree: 'Could not read the rings.',
    steward: 'steward', unknown: 'unknown',
    ringOf: (i, o) => `${i} of ${o}`,
    lastRing: (ago) => `last ring ${ago}`,
    // guided correction (build log 50)
    memTitle: 'Memory', tabRings: 'Rings', tabTurns: 'Turns',
    ringsHelp: 'You can mark a ring as right, or say what is wrong with it.',
    turnsHelp: (n) => `Every turn ${n || 'the companion'} remembers, newest first. Mark what is right, or say what is wrong — a correction takes effect at once and you can undo it here. Nothing is deleted.`,
    find: 'Find', findHint: 'Words from the turn…', more: 'Show older',
    noTurns: 'No turns.', noMem: 'Could not read the memory.',
    turnHead: (id, w, when) => `#${id} · ${w} · ${when}`,
    memUsed: 'remembered as it is',
    memAside: 'remembered with a tag: unverified — an earlier answer that may be wrong',
    memFiction: 'remembered with a tag: fiction',
    passedInTraining: 'Passed a check in training.',
    correctedInTraining: (r, x) => `Corrected in training: ${r}.` + (x ? ` The answer key says: “${x}”` : ''),
    seenAs: (tag) => `The tag in front of it when it comes back: ${tag}`,
    right: 'It’s right', wrong: 'Something’s wrong', undo: 'Undo', cancel: 'Cancel',
    supported: (p) => p ? `You marked this as right (+${p} trust).` : 'You marked this as right.',
    corrected: (r, x) => `You corrected this: ${r}.` + (x ? ` You wrote: “${x}”` : ''),
    supportAsk: (n, p) => `Mark this as right? It adds ${p} to ${n || 'the companion'}’s trust — at most 10 a day. A new level takes effect at the next start.`,
    supportGo: 'Mark as right',
    capped: 'Marked as right. Today’s trust from marking is used up, so this one adds none.',
    q1: 'What’s wrong with this?',
    reasons: { never: 'This never happened', part: 'Part of it is wrong',
               about: 'This was about something else', detail: 'A name or detail is wrong' },
    q2: 'What’s true? In your own words — it is kept word for word, as yours.',
    q2opt: 'Anything to add? You can leave this empty.',
    q3: 'Here’s what will change:',
    willTurn: 'This turn stays in memory. When it comes back, your correction stands in front of it. It will not go into a ring.',
    willRing: 'This ring stays in memory. When it comes back, your correction stands in front of it.',
    willFact: (x) => `What you wrote is remembered as yours, word for word: “${x}”`,
    willSupportGone: 'Your earlier “It’s right” on this is taken back.',
    willUndo: 'You can undo this here at any time. Nothing is deleted.',
    next: 'Next', confirm: 'Correct it', back: 'Back',
    stewardErrors: { text_required: 'Say what is true.', too_long: 'That is too long.',
                     characters: 'Brackets, vertical bars and line breaks cannot be kept.',
                     too_many_facts: 'The companion holds as many of your facts as it can.',
                     already_corrected: 'This is already corrected.', already_supported: 'This is already marked as right.',
                     corrected: 'Undo the correction first.', failed: 'Could not be saved.' },
    ago: (m) => m < 1 ? 'just now' : m < 60 ? `${m} min ago`
      : m < 2880 ? `${Math.floor(m / 60)} h ago` : `${Math.floor(m / 1440)} days ago`,
    fromRecord: 'from the record, not the model',
    fromKnown: 'from what it was built knowing, not the model',
    fromUnit: 'from the unit itself, not the model',
    fromLibrary: 'from the library, word for word, not the model',
    notLibrary: 'not from the library — say “look it up” to search it',
    explains: (x) => `her own words about the passage above${x ? ' (' + x + ')' : ''} — not the document’s; check them against it`,
    explainsPart: 'she was given only the first part of it',
    // the training loop (build log 64)
    train: 'Training', trainTitle: 'Training',
    trainHelp: (n) => `Homework for ${n || 'the companion'}: questions about itself and tasks for its tools, at each trust level in turn. Every answer is checked against a key. What it gets wrong is corrected in its memory and asked again next round; what is still wrong after three corrections is left alone and listed here. After each round it is asked to say again what it had wrong. A run lasts about four hours; you can pause it and go on.`,
    whoLabel: 'Its steward is called', whoSave: 'Save', whoNone: 'your name',
    whoSaved: 'Saved.',
    stewardHelp: 'Your own name, if it should know who its steward is. You can leave this empty.',
    trIdle: 'No run is going.',
    trState: (st, run) => `Run ${run} · ${st}`,
    trStatus: { running: 'running', paused: 'paused', stopping: 'stopping after this question',

let lang = 'en';                 // the console's language: the companion's once chosen
let name = null;                 // the companion's name: null until its steward chooses one
let setupLang = null;            // the language picked on the first setup screen
let lastBounds = null;
const t = () => T[lang] || T.en;

function applyLanguage() {
  const s = t();
  document.documentElement.lang = lang;
  $('markSub').textContent = s.sub;
  $('trustLabel').textContent = s.trust;
  $('memoryLabel').textContent = s.memory;
  $('recordBtn').textContent = s.record;
  $('shelfBtn').textContent = s.shelf;
  $('trainBtn').textContent = s.train;
  $('offBtn').textContent = s.off;
  $('intro1').textContent = s.intro1;
  $('intro2').textContent = s.intro2;
  send.textContent = s.send;
  $('hintText').textContent = s.hint;
  if (name) {
    $('markName').textContent = name;
    input.placeholder = s.placeholder(name);
    document.title = name;
  }
  if (lastBounds) $('bounds').textContent = s.bounds(lastBounds);
}

const scroll = () => { main.scrollTop = main.scrollHeight; };

function turn(who, cls) {
  const t = document.createElement('div');
  t.className = 'turn ' + cls;
  const w = document.createElement('div'); w.className = 'who'; w.textContent = who;
  const b = document.createElement('div'); b.className = 'bubble';
  t.append(w, b); transcript.append(t); scroll();
  return { root: t, body: b };
}

// The tag the node recorded for this answer. Arrives on the last line of the
// stream, after the answer itself, because the check needs the whole answer.
function provenance(turnEl, p) {
  if (!p) return;
  const s = t();
  const row = document.createElement('div'); row.className = 'prov';
  const tag = (text, kind) => {
    const e = document.createElement('span'); e.className = 'tag ' + kind;
    e.textContent = text; row.append(e);
  };
  if (p.checked === false) {
    turnEl.root.classList.add('flagged');
    tag(s.unchecked, 'flagged');
  } else if (p.unbacked_sources > 0) {
    turnEl.root.classList.add('flagged');
    tag(s.unverified, 'flagged');
  } else if (p.steward_credited && p.steward_backed === false) {
    // "My steward told me..." about something no fact shown on this turn says
    // (build log 41): tagged, and stored where memory never reads it.
    turnEl.root.classList.add('flagged');
    tag(s.stewardUnbacked, 'flagged');
    if (p.steward_why) {
      const w = document.createElement('span'); w.className = 'why'; w.textContent = p.steward_why; row.append(w);
    }
  } else if (p.mode === 'fiction') {
    turnEl.root.classList.add('fiction');
    tag(s.fiction, 'fiction');
  } else if (p.mode === 'record') {
    tag(s.fromRecord, 'quiet');
  } else if (p.mode === 'gate' || p.mode === 'tool') {
    // Answered by the unit itself - a refusal, its trust level, the to-do
    // list as it is in the file (build logs 49, 51) - model not called.
    tag(s.fromUnit, 'quiet');
  } else if (p.mode === 'library') {
    // A passage from the unit's library, word for word, model not called
    // (build log 57). The source is named under the passage itself.
    tag(s.fromLibrary, 'quiet');
  } else if (p.mode === 'known') {
    // Served verbatim from the curriculum, model not called. The one answer
    // that has to be exact: a 3B model retyping an address gets it wrong.
    tag(s.fromKnown, 'quiet');
  }
  // Why a turn was treated as fiction. Shown only there: beside anything
  // else, the fiction detector's reasoning is noise.
  if (p.why && p.mode === 'fiction') {
    const w = document.createElement('span'); w.className = 'why'; w.textContent = p.why; row.append(w);
  }
  // Her own answer, though a passage of the library says every word of the
  // question (build log 59). "look it up" asks the library the same thing.
  if (p.library_line) tag(s.notLibrary, 'quiet');
  // Her own words about a passage of the steward's own document (build log
  // 62): the passage stands above, word for word; this is the model's. Read
  // by hand on Lyra, about half of 18 explanations of a physics book said
  // something the passage does not - a wrong number, a film it never names,
  // once the opposite - so the label says to check them, every time.
  if (p.explains) {
    const where = [p.explains.title ? `“${p.explains.title}”` : '', p.explains.place || '']
      .filter(Boolean).join(', ');
    tag(s.explains(where), 'fiction');
    if (p.explains.part) tag(s.explainsPart, 'quiet');
  }
  if (p.memory_used) tag(s.usedMemory, 'quiet');
  if (p.tagged_used > 0) tag(s.usedTagged(p.tagged_used), 'quiet');
  if (p.facts_used > 0) tag(s.usedFacts, 'quiet');
  if (p.rings_used > 0) tag(s.usedRing, 'quiet');
  if (p.used_tools) tag(s.usedTools, 'quiet');
  if (row.children.length) turnEl.root.append(row);
  scroll();
}

async function ask(text) {
  if (busy || !name || !text.trim()) return;
  busy = true; send.disabled = true; $('intro')?.remove();
  turn(t().you, 'you').body.textContent = text;
  const tn = turn(name, 'node');
  tn.body.classList.add('cursor');

  let prov = null, cut = false;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'llama3.2:3b', stream: true,
                             messages: [{ role: 'user', content: text }] })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        let d; try { d = JSON.parse(line); } catch { continue; }
        const c = d.message?.content;
        if (c) { tn.body.textContent += c; scroll(); }
        if (d.aetherseed) prov = d.aetherseed;
        if (d.done && d.done_reason === 'error') cut = true;
      }
    }
  } catch (e) {
    if (!tn.body.textContent) tn.body.textContent = t().noAnswer;
    cut = true;
  } finally {
    tn.body.classList.remove('cursor');
    if (cut) {
      tn.root.classList.add('flagged');
      const row = document.createElement('div'); row.className = 'prov';
      const e = document.createElement('span'); e.className = 'tag flagged';
      e.textContent = t().cutOff; row.append(e); tn.root.append(row);
    }
    provenance(tn, prov);
    busy = false; send.disabled = false; input.focus();
  }
}

send.onclick = () => { const v = input.value; input.value = ''; input.style.height = 'auto'; ask(v); };
input.addEventListener('keydown', (e) => {

});
input.addEventListener('input', () => {

// ---- the steward's own documents (build log 62) -----------------------------
// Andreas, 5 Oct 2026: "a file upload button in the gui, that adds documents
// to the library/workspace". The file goes to the unit as it is, in the body
// of one request; the proxy keeps it and reads it into a collection of its
// own. The page then asks the list how the reading went.
const ON_THE_UNIT = ['127.0.0.1', 'localhost', '[::1]'].includes(location.hostname);
let shelfTimer = null, shelfInfo = null;

function shelfSay(id, text) {
  $(id).textContent = text || ''; $(id).hidden = !text;
}

async function loadShelf() {
  const s = t(), body = $('shelfBody');
  let d;
  try {
    const r = await fetch('/aetherseed/shelf');
    if (!r.ok) throw new Error(String(r.status));
    d = await r.json();
  } catch {
    body.replaceChildren(el('p', 'growing', s.shelfNoList));
    return;
  }
  shelfInfo = d;
  // Explaining is off in the build (build log 62); the page tells of it only
  // on a unit where it is on.
  $('shelfHow').textContent = d.explains ? s.shelfHowExplain : s.shelfHow;
  const mb = Math.floor((d.max_bytes || 0) / 1048576);
  $('shelfAdd').title = s.shelfKinds(mb);
  if (!ON_THE_UNIT && d.can_read_pdf === false && $('shelfError').hidden) shelfSay('shelfError', s.shelfNoPdf);
  const docs = d.documents || [];
  body.replaceChildren();
  if (!docs.length) body.append(el('p', 'growing', s.shelfNone));
  let reading = false;
  for (const doc of docs) {
    const node = el('div', 'doc');
    node.append(el('div', 'name', doc.title || doc.id));
    if (doc.state === 'reading') { reading = true; node.append(el('p', 'state fix', s.docReading)); }
    else if (doc.state === 'failed') node.append(el('p', 'state aside', s.docFailed(doc.note || '')));
    else {
      node.append(el('p', 'state ok', s.docReady(doc.pages, doc.passages ?? 0)));
      if (doc.note) node.append(el('p', 'state aside', doc.note));
    }
    if (doc.state !== 'reading') {
      const acts = el('div', 'acts'), rm = el('button', null, s.docRemove);
      rm.type = 'button';
      rm.onclick = () => {
        const yes = el('button', null, s.docYes), no = el('button', null, s.docNo);
        yes.type = no.type = 'button';
        no.onclick = loadShelf;
        yes.onclick = async () => {
          yes.disabled = true;
          try {
            await fetch('/aetherseed/shelf/remove', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: doc.id }) });
          } catch {}
          loadShelf();
        };
        acts.replaceChildren(el('span', 'state fix', s.docSure), yes, no);
      };
      acts.append(rm); node.append(acts);
    }
    body.append(node);
  }
  clearTimeout(shelfTimer);
  if (reading && !$('shelf').hidden) shelfTimer = setTimeout(loadShelf, 3000);
  else if (!reading && $('shelfProgress').textContent === s.shelfSent) shelfSay('shelfProgress', '');
}

$('shelfBtn').onclick = () => {
  if (!name) return;
  const s = t();
  $('shelfTitle').textContent = s.shelfTitle;
  $('shelfClose').textContent = s.close;
  $('shelfHelp').textContent = s.shelfHelp(name);
  $('shelfAdd').textContent = s.shelfAdd;
  shelfSay('shelfError', ''); shelfSay('shelfProgress', '');
  // The unit's own browser opens no file dialog (it is locked down, INSTALL
  // 9): there the button is not offered, and the way to add is told.
  $('shelfAddRow').hidden = ON_THE_UNIT;
  if (ON_THE_UNIT) shelfSay('shelfProgress', s.shelfHere);
  $('shelf').hidden = false;
  $('shelfClose').focus();

};
$('shelfClose').onclick = () => { $('shelf').hidden = true; clearTimeout(shelfTimer); };
$('shelfAdd').onclick = () => { $('shelfFile').value = ''; $('shelfFile').click(); };
$('shelfFile').onchange = () => {
  const f = $('shelfFile').files[0], s = t();
  if (!f) return;
  shelfSay('shelfError', '');
  const max = (shelfInfo && shelfInfo.max_bytes) || 0;
  if (max && f.size > max) { shelfSay('shelfError', s.shelfTooLarge(Math.floor(max / 1048576))); return; }
  $('shelfAdd').disabled = true;
  shelfSay('shelfProgress', s.shelfSending(0));
  // XMLHttpRequest, not fetch: it is the one that says how far the sending is.
  const x = new XMLHttpRequest();
  x.open('POST', '/aetherseed/upload');
  x.setRequestHeader('Content-Type', 'application/octet-stream');
  x.setRequestHeader('X-Filename', encodeURIComponent(f.name));
  x.upload.onprogress = (e) => {
    if (e.lengthComputable) shelfSay('shelfProgress', s.shelfSending(Math.floor(100 * e.loaded / e.total)));
  };
  const done = (ok, why) => {
    $('shelfAdd').disabled = false;
    shelfSay('shelfProgress', ok ? s.shelfSent : '');
    if (!ok) shelfSay('shelfError', why || s.shelfFailed);
    loadShelf();
  };
  x.onload = () => {
    let d = {}; try { d = JSON.parse(x.responseText); } catch {}
    done(x.status === 202, d.error);
  };
  x.onerror = x.onabort = x.ontimeout = () => done(false);
  x.send(f);
};

// ---- the ring tree ----------------------------------------------------------
// Everything shown here is set as text, never as markup: the turns and the
// model's sentence are things people and the model said.
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const minutesSince = (iso) => {
  const at = iso ? Date.parse(iso) : NaN;
  return isNaN(at) ? null : Math.max(0, Math.floor((Date.now() - at) / 60000));
};
function who(s, speaker) {
  if (speaker === 'steward' || speaker === 'owner') return s.steward;   // 'owner': rows from before the rename (50)
  return speaker || s.unknown;
}

// ---- memory: the ring tree and the turns, with guided correction -----------
// Build log 50 (Andreas, 30 Sep): "a guided correction where I can see and
// select memories and consolidations and make suggestions and support."
// Structured, not a free-text box (handover 4d): what is wrong, what is true,
// what will change - then confirm. The proxy checks and records every step
// (logic/steward.py); this page only asks.
const MAX_TRUE = 280;             // what fits a fact line with its source
let memTab = 'rings', turnQuery = '', oldestTurn = null;

async function steward(body) {
  const r = await fetch('/aetherseed/steward', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body) });
  let d = {};
  try { d = await r.json(); } catch {}
  if (!r.ok) throw Object.assign(new Error(d.error || String(r.status)), { code: d.code || 'failed' });
  return d;
}

// The status line and the buttons under one turn or ring. `item` carries
// {target, id, steward:{support, correction}}; `redraw` re-renders it.
function actions(box, item, redraw) {
  const s = t();
  box.querySelectorAll('.state.steward, .acts, .guide').forEach((e) => e.remove());
  const st = item.steward || {};
  if (st.support) box.append(el('p', 'state ok steward',
    st.support.by === 'training' ? s.passedInTraining : s.supported(st.support.trust_points)));
  if (st.correction) {
    // Whose correction it is (build log 64): the steward's own, or the
    // training loop's answer key - which is never shown as his words.
    const say = st.correction.by === 'training' ? s.correctedInTraining : s.corrected;
    box.append(el('p', 'state fix steward',
      say((s.reasons[st.correction.reason] || st.correction.reason).toLowerCase(), st.correction.text)));
    if (st.correction.tag) box.append(el('p', 'state aside steward', s.seenAs(st.correction.tag)));
  }
  const acts = el('div', 'acts');
  const note = st.correction || st.support;
  if (note) {
    const u = el('button', null, s.undo);
    u.onclick = async () => {
      u.disabled = true;
      try {
        const d = await steward({ action: 'undo', note: note.id });
        item.steward = {}; if (d.mode) item.mode = d.mode; redraw();
      }
      catch (e) { u.disabled = false; acts.append(el('span', 'err', s.stewardErrors[e.code] || s.stewardErrors.failed)); }
    };
    acts.append(u);
  }
  if (!st.correction && !st.support) {
    const ok = el('button', null, s.right);
    ok.onclick = () => askSupport(box, item, redraw);
    acts.append(ok);
  }
  if (!st.correction) {
    const bad = el('button', null, s.wrong);
    bad.onclick = () => guide(box, item, redraw);
    acts.append(bad);
  }
  box.append(acts);
}

function panel(box) {
  box.querySelectorAll('.guide').forEach((e) => e.remove());
  const g = el('div', 'guide'); box.append(g); return g;
}

function askSupport(box, item, redraw) {
  const s = t(), g = panel(box);
  g.append(el('h2', null, s.supportAsk(name, supportPoints)));
  const row = el('div', 'acts');
  const go = el('button', 'send', s.supportGo), no = el('button', null, s.cancel);
  no.onclick = () => g.remove();
  go.onclick = async () => {
    go.disabled = true;
    try {
      const d = await steward({ action: 'support', target: item.target, id: item.id });
      item.steward = { support: d.note, correction: null };
      redraw();
      if (d.capped) box.append(el('p', 'state aside steward', s.capped));
    } catch (e) {
      go.disabled = false; g.append(el('p', 'err', s.stewardErrors[e.code] || s.stewardErrors.failed));
    }
  };
  row.append(go, no); g.append(row);
}

function guide(box, item, redraw) {
  const s = t();
  let reason = null, text = '';
  const step1 = () => {
    const g = panel(box);
    g.append(el('h2', null, s.q1));
    const ch = el('div', 'choices');
    for (const k of Object.keys(s.reasons)) {
      const b = el('button', null, s.reasons[k]);
      b.onclick = () => { reason = k; step2(); };
      ch.append(b);
    }
    const no = el('button', null, s.cancel); no.onclick = () => g.remove();
    g.append(ch, el('div', 'acts')); g.lastChild.append(no);
    ch.querySelector('button')?.focus();
  };
  const step2 = () => {
    const g = panel(box);
    g.append(el('h2', null, reason === 'never' ? s.q2opt : s.q2));
    const ta = el('textarea'); ta.maxLength = MAX_TRUE; ta.value = text;
    const count = el('div', 'count', `${ta.value.length} / ${MAX_TRUE}`);
    const err = el('p', 'err'); err.hidden = true;
    ta.oninput = () => { count.textContent = `${ta.value.length} / ${MAX_TRUE}`; };
    const row = el('div', 'acts');
    const back = el('button', null, s.back), next = el('button', 'send', s.next);
    back.onclick = step1;
    next.onclick = () => {
      text = ta.value.replace(/\s+/g, ' ').trim();
      if (!text && reason !== 'never') { err.textContent = s.stewardErrors.text_required; err.hidden = false; return; }
      if (/[\[\]|]/.test(text)) { err.textContent = s.stewardErrors.characters; err.hidden = false; return; }
      step3();
    };
    row.append(back, next); g.append(ta, count, err, row); ta.focus();
  };
  const step3 = () => {
    const g = panel(box);
    g.append(el('h2', null, s.q3));
    const ul = el('ul');
    ul.append(el('li', null, item.target === 'turn' ? s.willTurn : s.willRing));
    if (text) ul.append(el('li', null, s.willFact(text)));
    if ((item.steward || {}).support) ul.append(el('li', null, s.willSupportGone));
    ul.append(el('li', null, s.willUndo));
    const err = el('p', 'err'); err.hidden = true;
    const row = el('div', 'acts');
    const back = el('button', null, s.back), go = el('button', 'send', s.confirm);
    back.onclick = step2;
    go.onclick = async () => {
      go.disabled = true;
      try {
        const d = await steward({ action: 'correct', target: item.target, id: item.id, reason, text });
        item.steward = { support: null, correction: d.note };
        if (item.target === 'turn') item.mode = 'unverified';
        redraw();
      } catch (e) {
        go.disabled = false; err.textContent = s.stewardErrors[e.code] || e.message || s.stewardErrors.failed; err.hidden = false;
      }
    };
    row.append(back, go); g.append(ul, err, row); go.focus();
  };
  step1();
}

async function loadRings() {
  const s = t(), body = $('treeBody');
  let d;
  try {
    const r = await fetch('/aetherseed/rings');
    if (!r.ok) throw new Error(String(r.status));
    d = await r.json();
  } catch {
    body.append(el('p', 'growing', s.noTree));
    return;
  }
  if (memTab !== 'rings') return;
  const rings = d.rings || [];
  if (!rings.length) body.append(el('p', 'growing', s.noRings));
  for (const ring of rings) {
    const node = el('details', 'ring');
    const m = minutesSince(ring.closed_at);
    node.append(el('summary', null, s.ringHead(ring.ring, (ring.turns || []).length,
                                               m == null ? '–' : s.ago(m))));
    node.append(el('p', 'chosen', `${s.chosen} ${ring.content || ''}`));
    if (ring.own_words) {
      node.append(el('p', 'own', `${s.ownWords(name)} “${ring.own_words}”`));
    } else {
      node.append(el('p', 'own quiet',
                     ring.own_words_note ? s.ownWithheld(ring.own_words_note) : s.ownPending));
    }
    const list = el('ol');
    for (const tu of ring.turns || []) {
      list.append(el('li', null, `#${tu.id} · ${who(s, tu.speaker)} · ${tu.user || ''}`));
    }
    node.append(list);
    const item = { target: 'ring', id: ring.id, steward: ring.steward || {} };
    const redraw = () => {
      const sum = node.querySelector('summary');
      sum.textContent = s.ringHead(ring.ring, (ring.turns || []).length, m == null ? '–' : s.ago(m))
        + (item.steward.correction ? ' · ✎' : item.steward.support ? ' · ✓' : '');
      actions(node, item, redraw);
    };
    redraw();
    body.append(node);
  }
  const g = d.growing;
  if (g && g.of) body.append(el('p', 'growing', s.growing(g.into, g.of)));
}

async function loadTurns(fresh) {
  const s = t(), body = $('treeBody');
  if (fresh) { body.replaceChildren(); oldestTurn = null; }
  const qs = new URLSearchParams({ limit: '30' });
  if (oldestTurn) qs.set('before', String(oldestTurn));
  if (turnQuery) qs.set('q', turnQuery);
  let d;
  try {
    const r = await fetch('/aetherseed/memories?' + qs.toString());
    if (!r.ok) throw new Error(String(r.status));
    d = await r.json();
  } catch {
    body.append(el('p', 'growing', s.noMem));
    return;
  }
  if (memTab !== 'turns') return;
  if (d.support_points != null) supportPoints = d.support_points;
  const turns = d.turns || [];
  if (fresh && !turns.length) body.append(el('p', 'growing', s.noTurns));
  for (const tu of turns) {
    oldestTurn = tu.id;
    const box = el('div', 'mem');
    const m = minutesSince(tu.at);
    box.append(el('div', 'head', s.turnHead(tu.id, who(s, tu.speaker), m == null ? '–' : s.ago(m))));
    const said = el('p', 'said');
    said.append(el('b', null, `${who(s, tu.speaker)}: `), document.createTextNode(tu.user || ''));
    const answer = el('p', 'said');
    answer.append(el('b', null, `${name || '–'}: `), document.createTextNode(tu.ai || ''));
    box.append(said, answer);
    const item = { target: 'turn', id: tu.id, mode: tu.mode, steward: tu.steward || {} };
    const modeLine = el('p', 'state aside');
    box.append(modeLine);
    const redraw = () => {
      const corrected = !!(item.steward || {}).correction;
      modeLine.hidden = corrected;
      modeLine.textContent = item.mode === 'unverified' ? s.memAside
        : item.mode === 'fiction' ? s.memFiction : s.memUsed;
      actions(box, item, redraw);
    };
    redraw();
    body.append(box);
  }
  $('turnMoreRow').hidden = !d.more;
}

$('memoryChip').onclick = () => openMemory('turns');
$('tabRings').onclick = () => setTab('rings');
$('tabTurns').onclick = () => setTab('turns');
$('turnSearch').onsubmit = (e) => { e.preventDefault(); turnQuery = $('turnQuery').value.trim(); loadTurns(true); };
$('turnMore').onclick = () => loadTurns(false);
$('treeClose').onclick = () => { $('tree').hidden = true; };
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('tree').hidden) $('tree').hidden = true;
  if (e.key === 'Escape' && !$('shelf').hidden) $('shelfClose').click();
  if (e.key === 'Escape' && !$('training').hidden) $('trainClose').click();
});

// ---- the training loop (build log 64) ----------------------------------------
// Andreas, 6 Oct 2026: "pausable and playable from the phone gui so I can see
// the progress and run it multiple times". The page shows what the proxy
// says and sends four words back: start, pause, resume, stop. Everything
// here is set as text, never markup - a reflection is the model's own words.
let trainTimer = null;
let trainAsking = false;     // "Stop this run?" is on the screen: a poll must not wipe it

async function trainSend(action) {
  const s = t();
  $('trainError').hidden = true;
  try {
    const r = await fetch('/aetherseed/training', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action }) });
    const d = await r.json();
    if (!r.ok) { $('trainError').textContent = d.error || s.trFailed; $('trainError').hidden = false; }
    drawTraining(d);
  } catch {
    $('trainError').textContent = s.trFailed; $('trainError').hidden = false;
  }
}

// A stage is judged by HER answers (build log 65): at least `bar` of them
// right, and every one of the unit's. Runs from before that carry no split.
const pct = (r, a) => a ? (Math.round(1000 * r / a) / 10) : 0;
function stagePassed(sc, bar) {
  if (!sc || !sc.asked) return false;
  if (sc.hers_asked == null) return sc.right / sc.asked >= bar;
  const unit = sc.asked - sc.hers_asked, unitRight = sc.right - sc.hers_right;
  return unitRight >= unit && (sc.hers_asked === 0 || sc.hers_right / sc.hers_asked >= bar);
}
function levelBoxes(s, scores, current, bar) {
  const box = el('div', 'levels');
  for (const lvl of Object.keys(scores || {})) {
    const sc = scores[lvl], node = el('div', 'lv');
    node.append(el('b', null, s.tiers[lvl] || lvl));
    if (!sc.asked) node.append(document.createTextNode('–'));
    else if (sc.hers_asked == null) node.append(document.createTextNode(`${sc.right} / ${sc.asked}`));
    else {
      node.append(el('span', null, s.trBoxHers(sc.hers_right, sc.hers_asked)), el('br'),
                  el('span', null, s.trBoxUnit(sc.right - sc.hers_right, sc.asked - sc.hers_asked)));
    }
    if (sc.asked && lvl !== current) node.classList.add(stagePassed(sc, bar) ? 'pass' : 'fail');
    if (lvl === current) node.classList.add('cur');
    box.append(node);
  }
  return box;
}

function drawTraining(d) {
  const s = t(), st = d.status || 'idle', live = st === 'running' || st === 'paused' || st === 'stopping';
  const state = $('trainState');
  if (!d.run) state.textContent = s.trIdle;
  else {
    const parts = [s.trState(s.trStatus[st] || st, d.run)];
    if (live && d.round) parts.push(s.trWhere(d.round, s.tiers[d.level] || d.level || '–',
                                              Math.min((d.position || 0) + 1, d.of || 0), d.of || 0));
    if (d.budget) parts.push(s.trTime(s.trDur(d.elapsed || 0), s.trDur(d.budget)));
    if (d.hers_asked) parts.push(s.trHers(d.hers_right || 0, d.hers_asked, pct(d.hers_right || 0, d.hers_asked)));
    else if (d.asked) parts.push(live ? s.trTotal(d.right || 0, d.asked) : s.trDone(d.right || 0, d.asked));
    state.textContent = parts.join(' · ');
  }
  $('trainBar').style.width = (d.budget ? Math.min(100, 100 * (d.elapsed || 0) / d.budget) : 0) + '%';
  const now = $('trainNow'), last = $('trainLast');
  now.hidden = !(st === 'running' && d.doing);
  if (!now.hidden) now.textContent = s.trNow(d.doing.topic, d.doing.by);
  last.hidden = !(live && d.last);
  if (!last.hidden) {
    last.className = 'state ' + (d.last.ok ? 'ok' : 'fix');
    last.textContent = (d.last.ok ? s.trLastOk(d.last.topic) : s.trLastBad(d.last.topic, d.last.why))
      + (d.last.retry ? s.trAgain : '');
  }
  if (d.note && /restarted/.test(d.note)) { $('trainError').textContent = s.trNote.restarted; $('trainError').hidden = false; }

  // the round in hand, level by level
  const cur = $('trainLevels');
  cur.replaceChildren();
  if (live && d.scores) cur.append(...levelBoxes(s, d.scores, d.level, d.pass_bar || 0.8).children);
  const rounds = d.rounds || [];
  // buttons
  const acts = $('trainActs');
  const btn = (text, fn, cls) => { const b = el('button', cls || null, text); b.type = 'button'; b.onclick = fn; acts.append(b); return b; };
  if (!(st === 'running' || st === 'paused')) trainAsking = false;
  if (!trainAsking) {
    acts.replaceChildren();
    if (st === 'running') { btn(s.trPause, () => trainSend('pause'), 'send'); }
    if (st === 'paused') { btn(s.trGoOn, () => trainSend('resume'), 'send'); }
    if (st === 'running' || st === 'paused') {
      btn(s.trStop, () => {
        trainAsking = true;
        acts.replaceChildren(el('span', 'state fix', s.trStopSure));
        btn(s.trYes, () => { trainAsking = false; trainSend('stop'); });
        btn(s.trNo, () => { trainAsking = false; loadTraining(); });
      });
    }
    if (!live) btn(s.trPlay, () => trainSend('start'), 'send');
  }
  $('trainReal').textContent = d.real_level ? s.trReal(s.tiers[d.real_level] || d.real_level) : '';

  // rounds of this run, newest first: scores, what it would have earned, what she said
  const out = $('trainRounds'); out.replaceChildren();
  if (rounds.length) {
    out.append(el('h2', null, s.trRoundsTitle));
    out.append(el('p', 'state aside', s.trBar(Math.round((d.pass_bar || 0.8) * 100))));
    // What the run is to be judged by: her own answers round by round, what
    // a correction taught, and what it did not.
    if (rounds.some((r) => r.hers_asked))
      out.append(el('p', 'state', s.trTrend(rounds.map((r) => r.hers_asked ? Math.round(100 * r.hers_right / r.hers_asked) : '–').join(' · '))));
    if (d.retries && d.retries.asked) out.append(el('p', 'state aside', s.trRetries(d.retries.right, d.retries.asked)));
    if ((d.learned || []).length) out.append(el('p', 'state ok', s.trLearned(d.learned.join('; '))));
    if ((d.not_learned || []).length) out.append(el('p', 'state fix', s.trNotLearned(d.give_up_after || 3, d.not_learned.join('; '))));
    for (const r of rounds.slice().reverse()) {
      const box = el('div', 'round');
      const head = r.hers_asked
        ? `${s.trRoundHers(r.round, r.hers_right, r.hers_asked, pct(r.hers_right, r.hers_asked))} · ${s.trUnitPart(r.right - r.hers_right, r.asked - r.hers_asked)}`
        : s.trRound(r.round, r.right, r.asked);
      box.append(el('div', 'head', `${head} · ${s.trEarned(s.tiers[r.earned] || r.earned)}`));
      box.append(levelBoxes(s, r.scores, null, d.pass_bar || 0.8));
      if (r.lessons) box.append(el('p', 'state ' + (r.restated === r.lessons ? 'ok' : 'fix'), s.trRestated(r.restated || 0, r.lessons)));
      box.append(el('p', 'state aside', r.reflection ? s.trReflection(name) : s.trNoReflection));
      if (r.reflection) box.append(el('p', 'said', r.reflection));
      out.append(box);
    }
  }
  const hist = $('trainHistory'); hist.replaceChildren();
  const earlier = (d.history || []).filter((h) => !(live && h.run === d.run));
  if (earlier.length) {
    hist.append(el('h2', null, s.trHistory));
    for (const h of earlier) {
      const best = s.tiers[h.earned_best] || h.earned_best, stt = s.trStatus[h.status] || h.status;
      hist.append(el('p', 'state aside', h.hers_asked
        ? s.trRunLineHers(h.run, stt, s.trDur(h.elapsed || 0), h.hers_right || 0, h.hers_asked,
            pct(h.hers_right || 0, h.hers_asked), (h.learned || []).length, (h.not_learned || []).length, best)
        : s.trRunLine(h.run, stt, s.trDur(h.elapsed || 0), h.right || 0, h.asked || 0, best)));
      if (h.hers_by_round && h.hers_by_round.length)
        hist.append(el('p', 'state aside', s.trTrend(h.hers_by_round.map((x) => x == null ? '–' : Math.round(x)).join(' · '))));
    }
  }
}

async function loadTraining() {
  const s = t();
  clearTimeout(trainTimer);
  try {
    const r = await fetch('/aetherseed/training');
    if (!r.ok) throw new Error(String(r.status));
    drawTraining(await r.json());
  } catch {
    $('trainState').textContent = s.trNoRead;
  }
  if (!$('training').hidden) trainTimer = setTimeout(loadTraining, 4000);
}

$('trainBtn').onclick = () => {
  if (!name) return;
  const s = t();
  $('trainTitle').textContent = s.trainTitle;
  $('trainClose').textContent = s.close;
  $('trainHelp').textContent = s.trainHelp(name);
  $('whoLabel').textContent = s.whoLabel;
  $('whoSave').textContent = s.whoSave;
  $('whoInput').placeholder = s.whoNone;
  $('whoInput').value = stewardName || '';
  $('whoError').hidden = true; $('trainError').hidden = true;
  $('training').hidden = false;
  $('trainClose').focus();
  loadTraining();
};
$('trainClose').onclick = () => { $('training').hidden = true; clearTimeout(trainTimer); status(); };
$('whoForm').onsubmit = async (e) => {
  e.preventDefault();
  const s = t(), err = $('whoError');
  err.hidden = true;
  try {
    const r = await fetch('/aetherseed/steward-name', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: $('whoInput').value.trim() }) });
    const d = await r.json();
    if (!r.ok) { err.className = 'err'; err.textContent = s.trErrors[d.code] || d.error || s.trFailed; err.hidden = false; return; }
    stewardName = (d.companion && d.companion.steward) || null;
    $('whoInput').value = stewardName || '';
    err.className = 'state ok'; err.textContent = s.whoSaved; err.hidden = false;
  } catch {
    err.className = 'err'; err.textContent = s.trFailed; err.hidden = false;
  }
};

// ---- first run --------------------------------------------------------------
function showSetup(languages) {
  const setup = $('setup');
  if (!setup.hidden) return;
  const list = $('langList'); list.replaceChildren();
  for (const l of languages || [{ code: 'en', label: 'English', note: '' }]) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lang'; b.textContent = l.label;
    if (l.note) { const sm = document.createElement('small'); sm.textContent = l.note; b.append(sm); }
    b.onclick = () => chooseLanguage(l.code);
    list.append(b);
  }
  setup.hidden = false;
  send.disabled = true; input.disabled = true;
  // One language on offer is not a choice: go straight to the name, and there
  // is nothing to go back to.
  const offered = languages || [];
  $('backBtn').hidden = offered.length <= 1;
  if (offered.length === 1) { chooseLanguage(offered[0].code); return; }
  $('stepLang').hidden = false; $('stepName').hidden = true;
  list.querySelector('button')?.focus();
}

function chooseLanguage(code) {
  setupLang = code;
  const s = T[code] || T.en;
  $('nameTitle').textContent = s.nameTitle;
  $('nameHelp').textContent = s.nameHelp;
  $('stewardHelp').textContent = s.stewardHelp;
  $('stewardInput').placeholder = s.whoNone;
  $('backBtn').textContent = s.back;
  $('nameGo').textContent = s.go;
  $('nameError').hidden = true;
  $('stepLang').hidden = true; $('stepName').hidden = false;
  $('nameInput').focus();
}

$('backBtn').onclick = () => { $('stepName').hidden = true; $('stepLang').hidden = false; };

$('stepName').onsubmit = async (e) => {
  e.preventDefault();
  const s = T[setupLang] || T.en;
  const err = $('nameError');
  const value = $('nameInput').value.trim();
  if (!value) { err.textContent = s.errors.required; err.hidden = false; return; }
  $('nameGo').disabled = true;
  try {
    const r = await fetch('/aetherseed/setup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: value, language: setupLang,
                             steward: $('stewardInput').value.trim() })
    });
    const d = await r.json();
    if (!r.ok) {
      err.textContent = (d.field === 'steward' ? s.trErrors[d.code] : s.errors[d.code]) || d.error || s.errors.network;
      err.hidden = false; return;
    }
    applyCompanion(d.companion);
    $('setup').hidden = true;
    send.disabled = false; input.disabled = false; input.focus();
  } catch {
    err.textContent = s.errors.network; err.hidden = false;
  } finally {
    $('nameGo').disabled = false;
  }
};

let stewardName = null;
function applyCompanion(c) {
  name = c && c.configured ? c.name : null;
  stewardName = (c && c.steward) || null;
  lang = (c && c.language) || 'en';
  applyLanguage();
}

// ---- status -----------------------------------------------------------------
// Nothing is set aside (build log 64): every turn is remembered, and the ones
// that are not plain fact - fiction, unverified, corrected - come back to her
// with a tag in front. "tagged" counts those.
function memoryLine(s, d) {
  if (d.remembered == null) return d.episodes ?? '–';   // an older proxy
  const line = s.remembered(d.remembered, d.tagged ?? d.set_aside ?? 0);
  return d.facts > 0 ? `${line} · ${s.told(d.facts)}` : line;
}

// "3 rings · 7 of 20 · last ring 4 days ago". A ring is one consolidation:
// 50 factual turns for the first, 20 for each after (step 32).
function ringLine(s, r) {
  if (!r) return '–';
  const parts = [s.rings(r.count), s.ringOf(r.into, r.of)];
  const at = r.last_at ? Date.parse(r.last_at) : NaN;
  if (!isNaN(at)) parts.push(s.lastRing(s.ago(Math.max(0, Math.floor((Date.now() - at) / 60000)))));
  return parts.join(' · ');
}

async function status() {
  try {
    const d = await (await fetch('/aetherseed/status')).json();
    const c = d.companion || { configured: false };
    if (c.configured) {
      if (c.name !== name || c.language !== lang || (c.steward || null) !== stewardName) applyCompanion(c);
    } else {
      name = null;
      showSetup(d.languages);
    }
    const s = t();
    $('health').className = 'dot up'; $('healthText').textContent = s.up;
    $('trust').textContent = s.tiers[d.trust_level] || d.trust_level || '–';
    $('episodes').textContent = memoryLine(s, d);
    $('rings').textContent = ringLine(s, d.rings);
    $('modelChip').textContent = d.model ?? '–';
    lastBounds = d.bounds || null;
    if (lastBounds) $('bounds').textContent = s.bounds(lastBounds);
  } catch {
    $('health').className = 'dot down'; $('healthText').textContent = t().down;
  }
}
applyLanguage();
$('healthText').textContent = t().checking;
status(); setInterval(status, 15000);
</script>
