<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon</title>
<style>
:root{
  --ground:#0C1110; --surface:#131A18; --surface-2:#1B2421; --line:#25322D;
  --ink:#E6EDE9; --ink-2:#A3B5AC; --ink-3:#71847B;
  --accent:#4FA582; --accent-soft:#16302680;
  --brass:#C89B5A; --brass-soft:#2E2413;
  --alarm:#C97A6C; --alarm-soft:#2F1D1A;
  --radius:10px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#EDF1EE; --surface:#F7FAF8; --surface-2:#E4EAE6; --line:#D2DBD6;
    --ink:#101815; --ink-2:#45544D; --ink-3:#6E7F77;
    --accent:#1F6F55; --accent-soft:#DCE9E3;
    --brass:#8A6427; --brass-soft:#F2E8D6;
    --alarm:#A44A3F; --alarm-soft:#F5E1DD;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font:16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"DejaVu Sans",sans-serif;
  display:flex; flex-direction:column;
}
header{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--line);
}
.mark{font-weight:600; letter-spacing:.01em; font-size:17px}
.mark span{color:var(--ink-3); font-weight:400; margin-left:8px; font-size:13px}
.chips{display:flex; gap:7px; flex-wrap:wrap; margin-left:auto; align-items:center}
.chip{
  font-size:12px; color:var(--ink-2); background:var(--surface-2);
  border:1px solid var(--line); border-radius:999px; padding:3px 10px; white-space:nowrap;
}
.chip b{color:var(--ink); font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block;margin-right:6px;vertical-align:-1px}
.dot.up{background:var(--accent)} .dot.down{background:var(--alarm)}
button{
  font:inherit; font-size:13px; color:var(--ink-2); background:var(--surface-2);
  border:1px solid var(--line); border-radius:8px; padding:5px 12px; cursor:pointer;
}
button:hover{color:var(--ink); border-color:var(--ink-3)}
button:disabled{opacity:.45; cursor:default}

main{flex:1; overflow-y:auto; padding:22px 16px 8px}
.wrap{max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:18px}

.turn{display:flex; flex-direction:column; gap:6px}
.who{font-size:12px; color:var(--ink-3); letter-spacing:.04em; text-transform:uppercase}
.bubble{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:12px 14px; white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.turn.you .bubble{background:var(--surface-2); border-color:transparent}
.turn.node .bubble{border-left:2px solid var(--accent)}
.turn.fiction .bubble{border-left-color:var(--brass)}
.turn.flagged .bubble{border-left-color:var(--alarm)}

.prov{display:flex; gap:7px; flex-wrap:wrap; font-size:12px; align-items:center}
.tag{border-radius:999px; padding:2px 9px; border:1px solid transparent}
.tag.fiction{background:var(--brass-soft); color:var(--brass); border-color:var(--brass)}
.tag.flagged{background:var(--alarm-soft); color:var(--alarm); border-color:var(--alarm)}
.tag.quiet{color:var(--ink-3)}
.why{color:var(--ink-3)}

.note{color:var(--ink-3); font-size:13px; text-align:center; padding:6px 0}
.record{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; white-space:pre-wrap; font-size:14px; color:var(--ink-2);
}
.record h3{margin:0 0 8px; font-size:13px; color:var(--ink); letter-spacing:.04em; text-transform:uppercase}

footer{
  background:var(--surface); border-top:1px solid var(--line); padding:12px 16px;
}
.composer{max-width:760px; margin:0 auto; display:flex; gap:10px; align-items:flex-end}
textarea{
  flex:1; resize:none; font:inherit; color:var(--ink); background:var(--ground);
  border:1px solid var(--line); border-radius:var(--radius); padding:11px 12px;
  min-height:46px; max-height:160px;
}
textarea:focus{outline:none; border-color:var(--accent)}
.send{background:var(--accent); color:#06120D; border-color:transparent; font-weight:600; padding:11px 18px}
.send:hover{color:#06120D}
.hint{max-width:760px; margin:8px auto 0; font-size:12px; color:var(--ink-3); display:flex; gap:14px; flex-wrap:wrap}
.cursor::after{content:"▍"; color:var(--accent); animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (max-width:560px){ .chips{width:100%; margin-left:0} }
</style>
</head>
<body>
<header>
  <div class="mark">Horizon<span>local companion</span></div>
  <div class="chips">
    <span class="chip"><span class="dot" id="health"></span><span id="healthText">checking</span></span>
    <span class="chip">trust <b id="trust">–</b></span>
    <span class="chip">memory <b id="episodes">–</b></span>
    <span class="chip" id="modelChip">–</span>
    <button id="recordBtn" title="Answered from the node's own record, not by the model">What have you gotten wrong?</button>
  </div>
</header>

<main id="main">
  <div class="wrap" id="transcript">
    <div class="note" id="intro">
      Everything here runs on this device. Nothing is sent anywhere.<br>
      Answers are bounded and their provenance is shown — fiction is labelled and is never used to answer a question of fact.
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask, or ask for something made up…" autofocus></textarea>
    <button class="send" id="send">Send</button>
  </div>
  <div class="hint">
    <span>Enter to send · Shift+Enter for a new line</span>
    <span id="bounds"></span>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const transcript = $('transcript'), main = $('main'), input = $('input'), send = $('send');
let busy = false;

const scroll = () => { main.scrollTop = main.scrollHeight; };

function turn(who, cls) {
  const t = document.createElement('div');
  t.className = 'turn ' + cls;
  const w = document.createElement('div'); w.className = 'who'; w.textContent = who;
  const b = document.createElement('div'); b.className = 'bubble';
  t.append(w, b); transcript.append(t); scroll();
  return { root: t, body: b };
}

function provenance(t, p) {
  if (!p) return;
  const row = document.createElement('div'); row.className = 'prov';
  const tag = (text, kind) => {
    const s = document.createElement('span'); s.className = 'tag ' + kind;
    s.textContent = text; row.append(s);
  };
  if (p.withheld) {
    // The bubble already holds the node's own explanation, sent in place of
    // the answer. The tag says the same thing in the badge row.
    t.root.classList.add('flagged');
    tag(p.withheld_reason === 'check_failed'
        ? 'Held back — could not be checked'
        : 'Held back — cited a source that could not be verified', 'flagged');
  } else if (p.unbacked_sources > 0) {
    t.root.classList.add('flagged');
    tag('Unverified source — not kept as memory', 'flagged');
  } else if (p.mode === 'fiction') {
    t.root.classList.add('fiction');
    tag('Fiction, at your request', 'fiction');
  }
  // Why a turn was treated as fiction. Shown only for fiction: next to a
  // held-back answer, the fiction detector's reasoning is just noise.
  if (p.why && p.mode === 'fiction') {
    const w = document.createElement('span'); w.className = 'why'; w.textContent = p.why; row.append(w);
  }
  if (p.memory_used) tag('used memory', 'quiet');
  if (p.used_tools) tag('used tools', 'quiet');
  if (row.children.length) t.root.append(row);
  scroll();
}

async function ask(text) {
  if (busy || !text.trim()) return;
  busy = true; send.disabled = true; $('intro')?.remove();
  turn('you', 'you').body.textContent = text;
  const t = turn('horizon', 'node');
  t.body.classList.add('cursor');

  let prov = null;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'llama3.2:3b', stream: true,
                             messages: [{ role: 'user', content: text }] })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        let d; try { d = JSON.parse(line); } catch { continue; }
        const c = d.message?.content;
        if (c) { t.body.textContent += c; scroll(); }
        if (d.aetherseed) prov = d.aetherseed;
      }
    }
  } catch (e) {
    t.body.textContent = t.body.textContent ||
      'The node did not answer. ' + (e.message || '');
    t.root.classList.add('flagged');
  } finally {
    t.body.classList.remove('cursor');
    provenance(t, prov);
    busy = false; send.disabled = false; input.focus();
  }
}

send.onclick = () => { const v = input.value; input.value = ''; input.style.height = 'auto'; ask(v); };
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send.click(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});

$('recordBtn').onclick = async () => {
  $('intro')?.remove();
  const t = turn('the record — read from the log, not written by the model', 'node');
  try {
    const r = await fetch('/aetherseed/record');
    const d = await r.json();
    t.body.className = 'record';
    t.body.textContent = d.summary || 'no record';
  } catch {
    t.body.textContent = 'Could not read the record.';
    t.root.classList.add('flagged');
  }
  scroll();
};

async function status() {
  try {
    const d = await (await fetch('/aetherseed/status')).json();
    $('health').className = 'dot up'; $('healthText').textContent = 'on device';
    $('trust').textContent = d.trust_level ?? '–';
    $('episodes').textContent = d.episodes ?? '–';
    $('modelChip').textContent = d.model ?? '–';
    const b = d.bounds || {};
    $('bounds').textContent =
      `bounds: paragraph · ${b.soft_stop_tokens} tok · ${b.num_predict} cap · ${b.wall_clock_s}s · prompt ceiling ${b.prompt_ceiling}`;
  } catch {
    $('health').className = 'dot down'; $('healthText').textContent = 'node unreachable';
  }
}
status(); setInterval(status, 15000);
</script>
</body>
</html>
