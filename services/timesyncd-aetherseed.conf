# AetherSeed Companion - the clock asks nobody.
# Installed at /etc/systemd/timesyncd.conf.d/aetherseed.conf.
#
#  No time servers, none
# to fall back on. systemd-timesyncd stays enabled for the one thing it does
# without a network: it saves the time to disk every minute and, at start,
# puts the clock forward to the last time saved - so a unit that was unplugged
# resumes from when it stopped, not from a date years back.
#
# What this costs, stated because it is real: the clock is no longer
# corrected. A unit that has been off is behind by as long as it was off,
# until someone sets it. The board's clock keeps time through a power cut
# only with a battery on its RTC connector.
[Time]
NTP=
FallbackNTP=
SaveIntervalSec=60
