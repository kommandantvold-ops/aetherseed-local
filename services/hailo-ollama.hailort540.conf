# Drop-in for hailo-ollama on a unit with HailoRT 5.4.0 (build log 68; plan
# claude/runtime-540-llama1b-plan.md). Installed ONLY on such a unit, as
#   /etc/systemd/system/hailo-ollama.service.d/hailort-540.conf
# A unit on 5.1.1 does not get it and is unchanged.
#
# Found on Xena, 8 Oct 2026, each one stopping the server or loosening it:
#  - the device is /dev/h1x-0, not /dev/hailo0: the start check and the
#    device allow-list named the old node (opening failed with EPERM);
#  - 5.4.0's server reads no config file: it binds by OLLAMA_HOST, and
#    without it listens on 0.0.0.0:8000;
#  - it finds a model only in $XDG_DATA_HOME/hailo-ollama/models/blob/ (by
#    default the service account's own, writable home). Pointed at /usr/share,
#    the model is read from a root-owned folder the service cannot write;
#  - it never needs to write there - nothing is pulled (build log 42b).
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/test -e /dev/h1x-0
DeviceAllow=
DeviceAllow=/dev/h1x-0 rw
Environment=OLLAMA_HOST=127.0.0.1:8000
Environment=XDG_DATA_HOME=/usr/share
ReadWritePaths=
